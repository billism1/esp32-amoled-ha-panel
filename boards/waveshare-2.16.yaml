# Board package: Waveshare ESP32-S3-Touch-AMOLED-2.16
#
# Display:  CO5300 QSPI AMOLED, 466x466 (panel actual; marketing says 480x480)
# Touch:    CST9220 over I2C @ 0x5A (added P3)
# IMU:      QMI8658 over I2C (added P4)
# PMU:      AXP2101 @ 0x34 on I2C (added P4)
# RTC:      PCF85063 on I2C (added P7)
#
# GPIO map — verified from waveshareteam/ESP32-S3-Touch-AMOLED-2.16 pin_config.h
# and the working sibling esphome-lvgl-dashboard build:
#   LCD QSPI: CS=12  SCLK=38  D0=4  D1=5  D2=6  D3=7  RST=2 (shared with TP_RST)
#   Touch:    SDA=15 SCL=14   INT=11 RST=2 (shared with LCD_RST)
#
# Substitutions (board-level defaults; overridable by top-level YAML).
substitutions:
  node_name: ha-amoled-panel
  friendly_name: "HA AMOLED Panel"
  # Panel physical = 466x466; controller addressable = 480x480. Over-draw to
  # 480 so the LVGL black background fills the bezel region instead of leaving
  # controller garbage (pink) showing through at the edges.
  disp_width: "480"
  disp_height: "480"

esphome:
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # PSRAM perf — required for smooth LVGL framebuffer access on stacked PSRAM.
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# 8 MB stacked PSRAM on the ESP32-S3R8 requires octal mode (guide §1).
# mipi_spi framebuffer will not init without this.
psram:
  mode: octal
  speed: 80MHz

# --- Display: CO5300 QSPI ---
spi:
  - id: lcd_qspi
    type: quad
    clk_pin: 38
    data_pins: [4, 5, 6, 7]

display:
  - id: amoled_display
    platform: mipi_spi
    model: CO5300
    spi_id: lcd_qspi
    bus_mode: quad
    cs_pin: 12
    # Pin 2 is shared with CST9220 touch RST — see touchscreen block below.
    reset_pin:
      number: 2
      allow_other_uses: true
    dimensions:
      width: ${disp_width}
      height: ${disp_height}
    data_rate: 40MHz
    color_order: rgb
    # Note: sibling esphome-lvgl-dashboard used `true` but our LVGL palette
    # came out inverted (white bg, black text). Set `false` for correct mapping.
    invert_colors: false
    brightness: 0xD0           # ~80%; P4 will replace with dynamic control
    update_interval: never     # LVGL drives flushes
    auto_clear_enabled: false

# --- I2C bus (touch now; IMU/PMU/RTC in later phases) ---
i2c:
  - id: bus_a
    sda: 15
    scl: 14
    frequency: 400kHz
    scan: true

# --- Touch + IMU (vendored components) ---
external_components:
  - source:
      type: local
      path: components
    components: [cst9220, qmi8658, ha_panel]

# --- IMU: QMI8658 (P4 — idle wake on motion) ---
# Hardware INT line is not routed to a free GPIO on this board (verified
# against waveshareteam pin_config.h). Component polls accel and fires
# `imu_motion` when frame-to-frame |Δa| exceeds motion_threshold_g.
qmi8658:
  id: imu
  i2c_id: bus_a
  address: 0x6B
  update_interval: ${imu_update_interval}
  motion_threshold: ${motion_threshold_g}
  motion_hold: 500ms
  motion:
    id: imu_motion
    name: "Panel motion"
    internal: true
    on_press:
      then:
        - script.execute: notify_input

touchscreen:
  - id: main_touchscreen
    platform: cst9220
    i2c_id: bus_a
    address: 0x5A
    reset_pin:
      number: 2
      allow_other_uses: true   # shared with display reset
    # Polling — INT pin handling deferred until idle/wake (P4) when battery
    # cost of 50ms polling matters more.
    touch_timeout: 50ms
    update_interval: 50ms
    # Per working Arduino reference (sand-multi project): setSwapXY(true) +
    # setMirrorXY(true, false). LVGL equivalent below.
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d  raw x=%d y=%d",
            touch.x, touch.y, touch.x_raw, touch.y_raw);
      - script.execute: notify_input
