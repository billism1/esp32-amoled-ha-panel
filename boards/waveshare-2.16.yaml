# Board package: Waveshare ESP32-S3-Touch-AMOLED-2.16
#
# Display:  CO5300 QSPI AMOLED, 466x466 (panel actual; marketing says 480x480)
# Touch:    CST9220 over I2C @ 0x5A (added P3)
# IMU:      QMI8658 over I2C (added P4)
# PMU:      AXP2101 @ 0x34 on I2C (added P4)
# RTC:      PCF85063 on I2C (added P7)
#
# GPIO map — verified from waveshareteam/ESP32-S3-Touch-AMOLED-2.16 pin_config.h
# and the working sibling esphome-lvgl-dashboard build:
#   LCD QSPI: CS=12  SCLK=38  D0=4  D1=5  D2=6  D3=7  RST=2 (shared with TP_RST)
#   Touch:    SDA=15 SCL=14   INT=11 RST=2 (shared with LCD_RST)
#
# Substitutions (board-level defaults; overridable by top-level YAML).
substitutions:
  node_name: ha-amoled-panel
  friendly_name: "HA AMOLED Panel"
  # Panel physical = 466x466; controller addressable = 480x480. Over-draw to
  # 480 so the LVGL black background fills the bezel region instead of leaving
  # controller garbage (pink) showing through at the edges.
  disp_width: "480"
  disp_height: "480"

esphome:
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
    # LVGL widget enables — required because ha_panel builds the widget tree
    # at runtime via the LVGL C API, so ESPHome's YAML-driven LV_USE_* detection
    # would otherwise strip these out.
    build_flags:
      - "-DLV_USE_FLEX=1"
      - "-DLV_USE_LABEL=1"
      - "-DLV_USE_BUTTON=1"
      - "-DLV_USE_TILEVIEW=1"
      - "-DLV_USE_BAR=1"      # required by LV_USE_SLIDER
      - "-DLV_USE_SLIDER=1"   # P7 settings tile brightness slider
      - "-DLV_USE_SWITCH=1"   # P7c per-domain row widget (binary entities)
      - "-DLV_USE_DROPDOWN=1" # P7d detail modal (HVAC mode, select options)
      - "-DLV_USE_CHART=1"    # E9 read-only entity history line chart

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # PSRAM perf — required for smooth LVGL framebuffer access on stacked PSRAM.
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# 8 MB stacked PSRAM on the ESP32-S3R8 requires octal mode (guide §1).
# mipi_spi framebuffer will not init without this.
psram:
  mode: octal
  speed: 80MHz

# --- Display: CO5300 QSPI ---
spi:
  - id: lcd_qspi
    type: quad
    clk_pin: 38
    data_pins: [4, 5, 6, 7]

display:
  - id: amoled_display
    platform: mipi_spi
    model: CO5300
    spi_id: lcd_qspi
    bus_mode: quad
    cs_pin: 12
    # Pin 2 is shared with CST9220 touch RST — see touchscreen block below.
    reset_pin:
      number: 2
      allow_other_uses: true
    dimensions:
      width: ${disp_width}
      height: ${disp_height}
    data_rate: 40MHz
    color_order: rgb
    # Note: sibling esphome-lvgl-dashboard used `true` but our LVGL palette
    # came out inverted (white bg, black text). Set `false` for correct mapping.
    invert_colors: false
    brightness: 0xD0           # ~80%; P4 will replace with dynamic control
    update_interval: never     # LVGL drives flushes
    auto_clear_enabled: false

# --- I2C bus (touch now; IMU/PMU/RTC in later phases) ---
i2c:
  - id: bus_a
    sda: 15
    scl: 14
    frequency: 400kHz
    scan: true

# --- Touch + IMU + PMU (vendored components) ---
external_components:
  - source:
      type: local
      path: components
    components: [cst9220, qmi8658, axp2101, ha_panel]

# --- IMU: QMI8658 (P4 — idle wake on motion) ---
# Hardware INT line is not routed to a free GPIO on this board (verified
# against waveshareteam pin_config.h). Component polls accel and fires
# `imu_motion` when frame-to-frame |Δa| exceeds motion_threshold_g.
qmi8658:
  id: imu
  i2c_id: bus_a
  address: 0x6B
  update_interval: ${imu_update_interval}
  motion_threshold: ${motion_threshold_g}
  motion_hold: 500ms
  motion:
    id: imu_motion
    name: "Panel motion"
    internal: true
    on_press:
      then:
        - script.execute: notify_input

# --- PMU: AXP2101 (P7b — header battery icon) ---
# Read-only VBAT via the averaged 14-bit voltage register. Sensor is internal
# (no HA entity) — feeds the on-panel header icon via on_value lambda.
axp2101:
  id: pmu
  i2c_id: bus_a
  address: 0x34
  update_interval: 30s
  battery_voltage:
    id: vbat_v
    internal: true
    on_value:
      then:
        - lambda: "id(ha_panel_id).set_battery_voltage(x);"

# --- Deep sleep (P8 — "Deep sleep" power-saver mode) ---
# Only entered manually via `deep_sleep.enter` from the idle machine's
# enter_sleep script; no sleep_duration/run_duration here, so it never
# auto-sleeps. Wake on the CST9220 touch INT (GPIO11, RTC-capable, active-low)
# via ext0 — the safe single-pin fallback from plan §P8 (the GPIO18 button +
# ext1 any-low path is a hardware-verification follow-up; motion + PWR button
# can NOT wake deep sleep on this board). GPIO11 idles high, pulses low on
# touch → inverted: true wakes on the low edge. KEEP_AWAKE (default) means a
# touch held down at sleep-entry just defers the sleep instead of cancelling.
deep_sleep:
  id: deep_sleep_ctl
  wakeup_pin:
    number: 11
    inverted: true

touchscreen:
  - id: main_touchscreen
    platform: cst9220
    i2c_id: bus_a
    address: 0x5A
    reset_pin:
      number: 2
      allow_other_uses: true   # shared with display reset
    # Polling — INT pin handling deferred until idle/wake (P4) when battery
    # cost of 50ms polling matters more.
    touch_timeout: 50ms
    update_interval: 50ms
    # P6: with LVGL UI, the P3 transform produced a 90° axis swap — physical
    # vertical swipes registered as horizontal in the tileview. ESPHome's
    # mipi_spi display has no rotation, so the touchscreen needs to match the
    # native framebuffer axes: no swap, no mirror. Adjust mirror_x / mirror_y
    # individually if a swipe direction comes out reversed.
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d  raw x=%d y=%d",
            touch.x, touch.y, touch.x_raw, touch.y_raw);
          // Click-sound gesture tracking: mark the press start. ha_panel decides
          // tap-vs-swipe on release and plays the click only for a tap.
          id(ha_panel_id).touch_pressed(touch.x, touch.y);
      - script.execute: notify_input
    on_update:
      - lambda: |-
          if (!touches.empty())
            id(ha_panel_id).touch_moved(touches[0].x, touches[0].y);
    on_release:
      - lambda: "id(ha_panel_id).touch_released();"

# --- Audio: ES8311 codec → onboard speaker (touch click feedback) ---
# Pins verified from waveshareteam pin_config.h (Mylibrary) + the 07_ES8311
# example: I2S MCLK=42 BCLK=9 LRCLK=45 DOUT=8; ES8311 on bus_a @ 0x18; PA
# (speaker amp) enable on GPIO46. ha_panel synthesizes a short low click and
# plays it on a registered tap (not a swipe), gated by the sound-on-press
# setting (sound_on_press_g, default off).
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: 42
    i2s_bclk_pin: 9
    i2s_lrclk_pin: 45

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: click_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: 8
    dac_type: external
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: mono
    # Keep the bus running once started — underruns are filled with silence, so
    # there is no per-click start/stop and thus no start/stop transient and no
    # fast-tap unevenness. Each click is just the same buffer re-queued, played
    # identically every press. The soft "knock" character lives in the click
    # sample itself (ha_panel setup()), not in any codec power-up ramp, so it is
    # consistent and portable. ha_panel stops the bus only when the click
    # setting is turned off (apply_sound_).
    timeout: never

# Speaker amplifier enable — held on so the codec output reaches the speaker.
switch:
  - platform: gpio
    id: audio_pa
    pin: 46
    internal: true
    restore_mode: ALWAYS_ON
