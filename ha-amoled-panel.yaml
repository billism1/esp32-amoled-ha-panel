# Top-level device YAML — board-agnostic shell.
# Swap the `board:` package line to switch hardware.
# See plan.md for the phased build sequence.

substitutions:
  node_name: ha-amoled-panel
  friendly_name: "HA AMOLED Panel"

# Settings (brightness / sleep) are restore_value globals. Default flash batching
# is 60 s; drop to 2 s so an Apply commits to NVS well within the 3 s power-button
# hold — i.e. it survives an immediate power-off.
preferences:
  flash_write_interval: 2s

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  # P8: light-sleep IDF helper (ha_power::enter_light_sleep), called from the
  # idle machine's enter_sleep script. Deep sleep uses the ESPHome component.
  includes:
    - power_mgr.h
  on_boot:
    # Priority -100: after components (PROCESSOR / DATA / AFTER_CONNECTION) are
    # constructed. Wire ha_panel's brightness setter to the display + idle
    # global so the settings-tile slider updates persist through idle cycles.
    - priority: -100
      then:
        - lambda: |-
            // P7b: preview setter drives display only (live slider drag).
            // Commit setter writes the persisted global (Apply only).
            id(ha_panel_id).set_brightness_setter([](uint8_t v) {
              id(amoled_display).set_brightness(v);
            });
            id(ha_panel_id).set_brightness_committer([](uint8_t v) {
              id(active_brightness_g) = v;
              // Persistence: GlobalsComponent::loop() saves the changed value to
              // the pending NVS buffer next tick; the top-level `preferences:`
              // flash_write_interval (2 s) commits it. 2 s < the 3 s power-button
              // hold, so even an immediate power-off persists.
            });
            id(ha_panel_id).set_active_brightness(id(active_brightness_g));
            // Apply the restored brightness at boot. idle_state starts = active
            // but nothing drives the display to the persisted level until the
            // first wake/input fires enter_active, so without this the screen
            // sits at the display component's init default after a cold boot.
            id(amoled_display).set_brightness(id(active_brightness_g));
            // P8: sleep settings — committer writes the persisted globals on
            // Apply; set_sleep_settings seeds the settings-tile controls from
            // the restored values at boot.
            id(ha_panel_id).set_sleep_committer([](bool enabled, uint8_t mode) {
              id(sleep_enabled_g) = enabled;
              id(power_saver_mode_g) = mode;
            });
            id(ha_panel_id).set_sleep_settings(id(sleep_enabled_g),
                                               id(power_saver_mode_g));
            // Touch click sound: hand ha_panel the speaker, the commit hook for
            // the persisted global, and the boot-restored toggle value.
            id(ha_panel_id).set_speaker(id(click_speaker));
            id(ha_panel_id).set_sound_committer([](bool on) {
              id(sound_on_press_g) = on;
            });
            id(ha_panel_id).set_sound_on_press(id(sound_on_press_g));
    # Existing display bring-up event for HA visibility.
    - priority: -200
      then:
        - delay: 2s
        - logger.log: "Display bring-up: first frame should be visible"
        - homeassistant.event:
            event: esphome.display_first_frame
            data:
              device: ${node_name}

# Push current HH:MM into the header clock label every 15 s. Runs against the
# HA time source declared in packages/base.yaml.
interval:
  - interval: 15s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            id(ha_panel_id).set_clock_text("--:--");
            return;
          }
          int h = t.hour;
          const char *ampm = (h >= 12) ? "pm" : "am";
          if (h == 0) h = 12;
          else if (h > 12) h -= 12;
          char buf[16];
          snprintf(buf, sizeof(buf), "%d:%02d %s", h, t.minute, ampm);
          id(ha_panel_id).set_clock_text(buf);

# Packages compose the firmware. ESPHome merges them at compile time.
# Board package owns hardware (pins, chip, PSRAM, display, touch, IMU).
# base = wifi/api/ota/logger. idle = dim/blank state machine + IMU wake.
# lvgl-ui = on-screen content.
packages:
  board: !include boards/waveshare-2.16.yaml
  base: !include packages/base.yaml
  idle: !include packages/idle.yaml
  ha_entities: !include packages/ha-entities.yaml
  # P7e: baked MDI glyph subset (GENERATED — tools/build-mdi-glyphs.py). Must
  # load before lvgl-ui so the mdi_icons font id exists for the anchor label.
  mdi_font: !include packages/mdi-font.yaml
  lvgl_ui: !include packages/lvgl-ui.yaml
