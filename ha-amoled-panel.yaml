# Top-level device YAML — board-agnostic shell.
# Swap the `board:` package line to switch hardware.
# See plan.md for the phased build sequence.

substitutions:
  node_name: ha-amoled-panel
  friendly_name: "HA AMOLED Panel"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Fires after wifi/api/display all up. Lets us confirm display bring-up
    # from HA's event log without needing USB serial.
    priority: -100
    then:
      - delay: 2s
      - logger.log: "Display bring-up: first frame should be visible"
      - homeassistant.event:
          event: esphome.display_first_frame
          data:
            device: ${node_name}

# Packages compose the firmware. ESPHome merges them at compile time.
# Board package owns hardware (pins, chip, PSRAM, display, touch, IMU).
# base = wifi/api/ota/logger. idle = dim/blank state machine + IMU wake.
# lvgl-ui = on-screen content.
packages:
  board: !include boards/waveshare-2.16.yaml
  base: !include packages/base.yaml
  idle: !include packages/idle.yaml
  lvgl_ui: !include packages/lvgl-ui.yaml
