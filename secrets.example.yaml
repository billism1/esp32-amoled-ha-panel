# Copy this file to `secrets.yaml` and fill in real values.
# `secrets.yaml` is gitignored — never commit it.

# --- Wi-Fi ---
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# --- Home Assistant ---
# Base URL of your HA instance. Used by the history chart's REST backfill when
# the ha_panel `history:` block is configured (see ha-entities.example.yaml).
# Otherwise reference only — ESPHome reaches HA over mDNS via the native API.
ha_url: "http://homeassistant.local:8123"

# HA long-lived access token for the entity history chart's REST backfill.
# Create one in HA: Profile → Security → Long-lived access tokens. Consumed only
# when the ha_panel `history:` block is enabled; without it (or on any fetch
# failure) the chart falls back to in-device samples since boot.
ha_history_token: "GENERATE_A_LONG_LIVED_ACCESS_TOKEN"

# ESPHome <-> HA native API encryption key. Generate with:
#   openssl rand -base64 32
# 32 bytes, base64. HA generates its half automatically when you add the
# ESPHome integration — no long-lived access token needed.
api_encryption_key: "GENERATE_A_BASE64_32_BYTE_KEY"

# OTA update password
ota_password: "CHANGE_ME_OTA_PASSWORD"

# Fallback AP password (used if Wi-Fi fails to connect)
ap_password: "CHANGE_ME_AP_PASSWORD"
