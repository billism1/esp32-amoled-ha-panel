# Board-agnostic base services: Wi-Fi, HA API, OTA, logger, captive portal,
# improv serial onboarding. Included from ha-amoled-panel.yaml.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Google Wifi mesh roams aggressively; power-save sleep + roam = drop loop.
  # Other esp32-amoled board on this network needed all three of these to stay up.
  power_save_mode: NONE
  fast_connect: true
  manual_ip:
    static_ip: 192.168.86.124
    gateway: 192.168.86.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password

captive_portal:

# First-flash Wi-Fi onboarding over USB serial — no rebuild required to
# change SSID. Works with the Improv Wi-Fi web installer.
improv_serial:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Phase 5: ha_panel component subscribes to HA entity state + calls HA
  # services. Both require explicit opt-in flags on the api block.
  homeassistant_states: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

# HA time source so later phases (RTC sync in P7, idle timers) have UTC.
time:
  - platform: homeassistant
    id: ha_time
