# LVGL UI package — board-agnostic.
#
# Phase 6: ha_panel builds the widget tree at runtime (lv_tileview + per-area
# lv_list + entity rows + area-picker modal) via the LVGL C API. This package
# only sets up the LVGL component itself and an empty main page; ha_panel
# attaches everything to lv_scr_act() in its setup().

lvgl:
  displays:
    - amoled_display
  buffer_size: 25%
  bg_color: 0x000000
  # Setting default_font to montserrat_18 forces the symbol to link so we can
  # reference lv_font_montserrat_18 from C++ when constructing widgets.
  default_font: montserrat_18
  pages:
    - id: main_page
      bg_color: 0x000000
      # P7e: anchor the generated MDI font (packages/mdi-font.yaml) into LVGL.
      # Referencing an ESPHome font in lvgl config is what defines USE_LVGL_FONT
      # and links the glyph data; ha_panel then draws the entity icon column via
      # set_mdi_font() → font::Font::get_lv_font(). The label itself is hidden and
      # 0-sized — it exists only to force the font to compile in.
      widgets:
        - label:
            id: mdi_font_anchor
            text: "\U000F0335"
            text_font: mdi_icons
            hidden: true
