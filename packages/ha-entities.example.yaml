# Static page + entity map for the panel — example template.
#
# USAGE:
#   1. Copy this file to `packages/ha-entities.yaml`.
#   2. Replace every page and entity with your own.
#   3. `packages/ha-entities.yaml` is gitignored; your real config never leaves
#      this machine.
#
# Pages render left-to-right in the carousel in the order declared here.
# Entities render top-to-bottom inside a page in the order declared here.
# Phase 5 reads this; Phase 9 will replace it with a live HA template sensor.
#
# Filter recommendation: keep domains the panel actually does something with —
#   light, switch, fan, input_boolean, automation, script, cover  → tap-toggle
#   sensor, binary_sensor, climate, media_player                  → read-only
# Skip noisy/internal domains: sun, zone, person, device_tracker, update,
# number, select, button — they clutter the carousel without adding value.
#
# Friendly names are optional but recommended; the panel falls back to the
# entity_id if not provided.
#
# Tap-confirm (P7f): add `confirm: true` to guard an entity against accidental
# brushes. Short-tap then opens a confirm sheet (action/lock/cover/switch) or
# the detail modal (light/climate/media_player/number/select/fan) instead of
# firing immediately — the action commits only on a second, deliberate tap.
# Meaningless on read-only domains (sensor, binary_sensor, weather…); set there
# it is ignored and warned about at compile time. Default false.
#
# Icons (P7e): each row shows an icon left of the friendly name. By default it
# comes from the entity's domain (light → bulb, lock → lock, etc). Add an
# optional `icon: mdi:foo` to override per entity. The glyph must be in the
# baked subset — see tools/build-mdi-glyphs.py to add new ones. Unknown names
# fall back to a generic glyph and log once.
#
# Realtime plot (UE7): add `realtime: true` to a numeric sensor / binary_sensor
# to skip the REST history backfill and plot purely from the in-device ring
# buffer + live stream. The history sheet opens on a short "Live" window (~2 min)
# that scrolls in real time. For high-rate feeds (e.g. 1 Hz MQTT sensors) that HA
# does not record, where a backfill fetch is wasted and the live stream is the
# data source. No effect on entities HA records normally — leave it off for those.
#
# Status LED severity (UE7): every `binary_sensor` row carries a glowing status
# dot. Its COLOUR is chosen by the entity's Home Assistant `device_class` (which
# the panel subscribes automatically — nothing to configure here), so the dot
# means something instead of always-green:
#   PROBLEM  class on → RED   — moisture(leak)/smoke/gas/co/safety/problem/
#                               tamper/heat/cold/battery; "on" = bad. off = dim green.
#   ACTIVITY class on → AMBER — motion/occupancy/presence/door/window/opening/
#                               garage_door/…; "on" = active (no good/bad). off = grey.
#   POSITIVE class on → GREEN — connectivity/battery_charging; "on" = good. off = red.
#   no/unknown device_class   → plain green-on / grey-off (unchanged from before).
# The on/off word beside the dot is recoloured to match (redundant for colour-
# blind readers). See the "Safety" page below for one of each.
#
# Row size (E8): add an optional `size:` to make a row bigger and more glanceable
# from across the room. Values: small (default, today's look), medium, large.
# Size scales the whole row together — height, name font, icon glyph, and the
# right-side widget. Omit it and the row is byte-for-byte the small default.
# Mixed sizes within one page are fine; each row sizes independently.
#   Flash cost: medium/large draw crisp icons from extra baked MDI fonts
#   (mdi_icons_36 / mdi_icons_48) plus montserrat_24/32. All five fonts are a
#   small glyph subset and fit comfortably on the 16 MB board. If you never use
#   medium/large you can drop the mdi_font_medium/large keys below — those rows
#   then upscale the 24 px icon (still works, just softer).
#
# Text styles (UE13): add `style:` to a row (entity OR report) to style its
# name/title — a list of any of bold / italic / underline, e.g. style: [bold] or
# style: [bold, underline]. Bold/italic use baked Montserrat variants (already
# wired via packages/style-fonts.yaml — pulled from Google Fonts at build, ~tens
# of KB flash); underline is free. bold+italic together renders as bold (no
# bold-italic font baked). Full reference in README.md → "Row text styles".
#
# Report rows (UE12): instead of an `entity_id:`, a row can carry a `report:`
# block that shows a COMPUTED AGGREGATE over your other entities (lights on,
# totals, offline count, min/max/avg of a sensor group). `scope: page` limits it
# to the page it's on; `scope: all` (default) spans the whole panel. Optional
# `icon: mdi:foo` shows an icon like any other row. See the worked examples on
# the "Living Room" page below. FULL reference — every `type:` value and how to
# find valid `domains` / `match_state` / `device_class` values for your own
# entities — is in README.md → "Defining your pages" → "Report rows".
# (Quote on/off states as ["on"], not [on] — YAML reads bare on/off as booleans.)
#
# Page picker badges (UE11): add a page-level `picker_badge:` to show a small
# icon+value to the RIGHT of the page name in the page picker — an at-a-glance
# "is anything on over there". A page may declare ONE badge or a LIST of badges
# (stacked horizontally, right-aligned; the page name stays left). Each badge is
# computed fresh every time the picker opens (and updates live while open),
# scoped to THAT PAGE'S entities only. Default omitted = none.
# A QUIET badge (0 lights on, no alarm) stays visible but GREYED — its presence
# means "monitoring this", the grey means "nothing to report"; it brightens when
# something's notable. A badge only HIDES when the page has nothing in scope to
# monitor (e.g. lights_on on a page with no lights).
#
#   picker_badge: lights_on                       # bare type name (sugar)
#   picker_badge: [lights_on, open_covers]        # a list, stacked right
#   picker_badge: { type: temperature, agg: avg } # block form (carries params)
#   picker_badge: { type: low_battery, threshold: 20 }
#
# Selectable `type:` values (unknown value = compile error):
#   Config-free (work today, domain + state only):
#     lights_on       light == on                          → bulb + N
#     devices_on      switch / fan / input_boolean == on   → plug + N
#     unlocked        lock != locked                       → open-lock + N
#     open_covers     cover != closed                      → open-shutter + N
#     media_playing   media_player == playing              → play + N
#     climate_active  climate != off                       → thermostat + N
#     running         script/automation on, timer active   → cog + N
#     offline         unavailable / unknown                → red alert + N
#     entities        total entities on the page           → N
#     idle            green check when nothing on / open
#   Driven by device_class (LIVE since UE7 — read each entity's HA device_class):
#     open_doors      binary_sensor door/window/garage on  → door + N (amber)
#     motion          binary_sensor motion/occupancy on    → motion + N (amber)
#     low_battery     battery device_class <= threshold:   → battery + N (red)
#     alarm           smoke/moisture/co/gas/problem/safety → red dot, no number
#     temperature     agg: avg|min|max of temp sensors     → thermometer + value
#     humidity        avg of humidity sensors              → drop + value
#     power           sum of power sensors                 → power + value
#     co2 / aqi        avg of co2 / aqi sensors            → gauge + value
#     severity        composite: alarm→red, doors→amber, offline→amber dot
#   NOTE: device_class is NOT a key you set here — the panel subscribes each
#   binary_sensor / sensor entity's device_class from Home Assistant at connect
#   (UE7). You just pick the badge/report type; it reads the real attribute. If a
#   class-driven badge stays empty, the entity has no device_class in HA (check
#   Developer Tools → States → Attributes). See the "Safety" page below.
# Block params: `agg:` (avg|min|max|sum, numeric badges) · `threshold:` (int,
# low_battery percent, default 20) · `unit:` (suffix override for numeric badges)
# · `icon:` (mdi:foo to override the type's default glyph; baked-subset only).
#
# Icons: value is `mdi:<name>` from https://pictogrammers.com/library/mdi/ — but
# ONLY glyphs in this panel's baked subset render; anything else falls back to a
# generic glyph (and logs once at boot). Add new ones to the EXTRA_ICONS list in
# tools/build-mdi-glyphs.py, rerun it, then reflash. Common baked picks for reports:
#   lights      mdi:lightbulb-multiple  mdi:lightbulb-on  mdi:lightbulb
#   plugs/power mdi:power-plug  mdi:power
#   count/total mdi:gauge  mdi:format-list-bulleted  mdi:numeric
#   climate     mdi:thermometer  mdi:water-percent
#   security    mdi:door-open  mdi:window-open  mdi:lock  mdi:motion-sensor
#   alerts      mdi:leak  mdi:smoke-detector  mdi:alert-circle  mdi:battery
#   misc        mdi:home  mdi:checkbox-marked-circle-outline

ha_panel:
  id: ha_panel_id      # referenced by id(ha_panel_id) in lambdas (clock, api triggers, brightness setter)
  mdi_font: mdi_icons             # P7e: font id from packages/mdi-font.yaml (icon column)
  mdi_font_medium: mdi_icons_36   # E8: crisp icons for size: medium rows
  mdi_font_large: mdi_icons_48    # E8: crisp icons for size: large rows
  # E9: OPTIONAL — REST history backfill for the sensor history chart sheet.
  # Omit this whole block and the chart shows only in-device since-boot samples.
  # With it, tapping a numeric sensor / binary_sensor backfills the full window
  # from HA. Requires a long-lived access token (HA → Profile → Security) in
  # secrets.yaml as `ha_history_token`, plus `ha_url` (your HA base URL).
  # history:
  #   http_request_id: ha_http    # http_request component id from packages/base.yaml
  #   time_id: ha_time            # time component id from packages/base.yaml
  #   base_url: !secret ha_url
  #   token: !secret ha_history_token
  pages:
    - name: "Living Room"
      # UE11: a LIST of picker badges — bulb count + active-climate count,
      # stacked right of the page name. Each greys out when its count is 0.
      picker_badge: [lights_on, climate_active]
      entities:
        # UE12: computed-aggregate rows (no entity_id). View-only.
        - report:
            type: count
            title: "Lights on"
            domains: [light]
            match_state: ["on"]
            show_total: true       # "2 / 5"
            scope: page            # only this page's lights (omit/all = whole panel)
            icon: mdi:lightbulb-multiple   # baked glyph — see icon list above
            style: [bold]          # bold title — also italic / underline (list)
          size: medium
        - report:
            type: offline
            title: "Offline devices"   # red count when anything is unavailable
            # scope omitted → all pages
        - report:
            type: max                  # also: min / avg / sum
            title: "Warmest room"
            domains: [sensor]
            show_source: true          # "Office 24°"
            unit: "°"
        - entity_id: light.living_room_lamp
          friendly_name: "Couch lamp"
          icon: mdi:floor-lamp   # optional per-entity override
          size: large            # E8: big glanceable row (small | medium | large)
        - entity_id: switch.tv_power
          friendly_name: "TV"
          size: medium
        - entity_id: sensor.living_room_temperature
          friendly_name: "Temperature"
        - entity_id: sensor.live_power_draw
          friendly_name: "Live Power"
          realtime: true          # high-rate, unrecorded → live ring-buffer plot

    # ───────────────────────────────────────────────────────────────────────
    # UE7 worked example: the device_class layer. Every binary_sensor below
    # gets a severity-coloured status LED, and the reports + picker badges
    # aggregate by device_class — all from the entity's HA device_class, which
    # the panel auto-subscribes (no device_class key on the rows themselves).
    # entity_ids here are illustrative; the `# device_class:` comments note what
    # each one reports in HA, which is what actually drives the colour/badge.
    # ───────────────────────────────────────────────────────────────────────
    - name: "Safety"
      # UE11 device_class badges, stacked right of the page name. Each reads the
      # page's own binary_sensor / sensor device_classes:
      picker_badge:
        - alarm                                  # RED dot if any leak/smoke/gas/CO on
        - { type: open_doors }                   # AMBER N: doors/windows/garage open
        - { type: low_battery, threshold: 20 }   # RED N: batteries at/below 20%
        - { type: temperature, agg: avg }        # avg of this page's temp sensors
      entities:
        # ── Severity LED demo — one binary_sensor per bucket ──
        # PROBLEM classes → RED dot when "on" (an alarm), dim green when clear:
        - entity_id: binary_sensor.basement_leak     # device_class: moisture
          friendly_name: "Basement leak"             #   on → RED (water detected)
        - entity_id: binary_sensor.hallway_smoke      # device_class: smoke
          friendly_name: "Smoke detector"            #   on → RED (alarm)
        # ACTIVITY classes → AMBER dot when "on" (active), grey when idle:
        - entity_id: binary_sensor.front_door         # device_class: door
          friendly_name: "Front door"                #   open → AMBER (active)
        - entity_id: binary_sensor.hallway_motion     # device_class: motion
          friendly_name: "Hallway motion"            #   detected → AMBER
        # POSITIVE class → GREEN when "on" (good), RED when "off" (down):
        - entity_id: binary_sensor.internet_up        # device_class: connectivity
          friendly_name: "Internet"                  #   connected → GREEN
        # ── Numeric sensors — their device_class feeds the reports/badges below ──
        - entity_id: sensor.fridge_battery            # device_class: battery
          friendly_name: "Fridge battery"
        - entity_id: sensor.outdoor_temperature       # device_class: temperature
          friendly_name: "Outdoor temp"
        - entity_id: sensor.bathroom_humidity         # device_class: humidity
          friendly_name: "Bathroom humidity"
        - entity_id: sensor.house_power               # device_class: power
          friendly_name: "House power"
        # ── Class-gated report rows (UE12) — the `device_class:` filter is live ──
        # A report filters on ONE device_class. "Open doors" = door binary_sensors
        # that are on (use the open_doors BADGE above to also fold in window/garage).
        - report:
            type: count
            title: "Open doors"
            domains: [binary_sensor]
            device_class: door
            match_state: ["on"]
            scope: page
            icon: mdi:door-open
            style: [bold]
        - report:
            type: bool                 # green ✓ when none, amber N when any
            title: "Smoke alarms"
            domains: [binary_sensor]
            device_class: smoke
            match_state: ["on"]
            scope: page
            icon: mdi:smoke-detector
        - report:
            type: min                  # lowest battery, with the entity's name
            title: "Lowest battery"
            domains: [sensor]
            device_class: battery
            show_source: true          # "Fridge battery 12%"
            unit: "%"
            scope: page
            icon: mdi:battery-alert
        - report:
            type: avg
            title: "Avg temperature"
            domains: [sensor]
            device_class: temperature
            unit: "°"
            scope: page
            icon: mdi:thermometer
        - report:
            type: sum
            title: "Total power"
            domains: [sensor]
            device_class: power
            unit: " W"
            scope: page
            icon: mdi:power

    - name: "Kitchen"
      picker_badge: devices_on       # UE11: bare single badge (plug + count)
      entities:
        - entity_id: light.kitchen_ceiling
          friendly_name: "Ceiling"
        - entity_id: binary_sensor.dishwasher_running
          friendly_name: "Dishwasher"

    - name: "Bedroom"
      # UE11: block single + icon override (blinds glyph instead of the default).
      picker_badge: { type: open_covers, icon: mdi:blinds-open }
      entities:
        - entity_id: light.bedside_lamp
          friendly_name: "Bedside"
        - entity_id: cover.bedroom_blinds
          friendly_name: "Blinds"
        - entity_id: cover.garage_door
          friendly_name: "Garage door"
          confirm: true            # short-tap → Open/Stop/Close confirm sheet

    - name: "Office"
      picker_badge: [running, offline]   # UE11: jobs running + any dead devices
      entities:
        - entity_id: script.start_focus_lighting
          friendly_name: "Focus mode"
        - entity_id: automation.morning_routine
          friendly_name: "Morning routine"
