# Static page + entity map for the panel — example template.
#
# USAGE:
#   1. Copy this file to `packages/ha-entities.yaml`.
#   2. Replace every page and entity with your own.
#   3. `packages/ha-entities.yaml` is gitignored; your real config never leaves
#      this machine.
#
# Pages render left-to-right in the carousel in the order declared here.
# Entities render top-to-bottom inside a page in the order declared here.
# Phase 5 reads this; Phase 9 will replace it with a live HA template sensor.
#
# Filter recommendation: keep domains the panel actually does something with —
#   light, switch, fan, input_boolean, automation, script, cover  → tap-toggle
#   sensor, binary_sensor, climate, media_player                  → read-only
# Skip noisy/internal domains: sun, zone, person, device_tracker, update,
# number, select, button — they clutter the carousel without adding value.
#
# Friendly names are optional but recommended; the panel falls back to the
# entity_id if not provided.
#
# Tap-confirm (P7f): add `confirm: true` to guard an entity against accidental
# brushes. Short-tap then opens a confirm sheet (action/lock/cover/switch) or
# the detail modal (light/climate/media_player/number/select/fan) instead of
# firing immediately — the action commits only on a second, deliberate tap.
# Meaningless on read-only domains (sensor, binary_sensor, weather…); set there
# it is ignored and warned about at compile time. Default false.
#
# Icons (P7e): each row shows an icon left of the friendly name. By default it
# comes from the entity's domain (light → bulb, lock → lock, etc). Add an
# optional `icon: mdi:foo` to override per entity. The glyph must be in the
# baked subset — see tools/build-mdi-glyphs.py to add new ones. Unknown names
# fall back to a generic glyph and log once.

ha_panel:
  id: ha_panel_id      # referenced by id(ha_panel_id) in lambdas (clock, api triggers, brightness setter)
  mdi_font: mdi_icons  # P7e: font id from packages/mdi-font.yaml (icon column)
  pages:
    - name: "Living Room"
      entities:
        - entity_id: light.living_room_lamp
          friendly_name: "Couch lamp"
          icon: mdi:floor-lamp   # optional per-entity override
        - entity_id: switch.tv_power
          friendly_name: "TV"
        - entity_id: sensor.living_room_temperature
          friendly_name: "Temperature"

    - name: "Kitchen"
      entities:
        - entity_id: light.kitchen_ceiling
          friendly_name: "Ceiling"
        - entity_id: binary_sensor.dishwasher_running
          friendly_name: "Dishwasher"

    - name: "Bedroom"
      entities:
        - entity_id: light.bedside_lamp
          friendly_name: "Bedside"
        - entity_id: cover.bedroom_blinds
          friendly_name: "Blinds"
        - entity_id: cover.garage_door
          friendly_name: "Garage door"
          confirm: true            # short-tap → Open/Stop/Close confirm sheet

    - name: "Office"
      entities:
        - entity_id: script.start_focus_lighting
          friendly_name: "Focus mode"
        - entity_id: automation.morning_routine
          friendly_name: "Morning routine"
